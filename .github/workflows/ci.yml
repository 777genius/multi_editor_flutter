name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Supersede ordinary CI per event and PR/ref; manual runs stay independent.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FLUTTER_VERSION: '3.35.0'
  DART_VERSION: '3.8.0'

jobs:
  # ============================================================================
  # Code Quality Checks
  # ============================================================================

  analyze:
    name: Dart Analyze & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🔍 Run Dart analyzer
        run: |
          cd app
          flutter analyze --fatal-infos --fatal-warnings

      - name: 📝 Check code formatting
        run: |
          cd app
          dart format --set-exit-if-changed .

  # ============================================================================
  # Unit & Widget Tests
  # ============================================================================

  test:
    name: Tests (Unit & Widget)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🧪 Run tests
        run: |
          cd app
          flutter test --coverage --reporter expanded

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: app/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📈 Coverage report
        run: |
          cd app
          if [ -f coverage/lcov.info ]; then
            echo "Coverage report generated"
            # Show coverage summary
            flutter pub global activate coverage
            flutter pub global run coverage:format_coverage \
              --lcov \
              --in=coverage/lcov.info \
              --report-on=lib \
              --out=coverage/lcov.info
          fi

  # ============================================================================
  # Security Audit
  # ============================================================================

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🔒 Run dependency audit
        run: |
          cd app
          # Check for known vulnerabilities in dependencies
          dart pub audit || echo "Some dependencies have known issues"

      - name: 🔍 Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          echo "Checking for hardcoded secrets..."
          ! grep -r "password\s*=\s*['\"]" app/lib/ || exit 1
          ! grep -r "api_key\s*=\s*['\"]" app/lib/ || exit 1
          ! grep -r "secret\s*=\s*['\"]" app/lib/ || exit 1
          echo "No hardcoded secrets found"

      - name: 🛡️ Check security configuration
        run: |
          # Verify security config exists
          if [ -f app/lib/core/security/security_config.dart ]; then
            echo "✅ Security configuration found"
          else
            echo "❌ Security configuration missing"
            exit 1
          fi

  # ============================================================================
  # Build Tests
  # ============================================================================

  build-linux:
    name: Build - Linux
    runs-on: ubuntu-latest
    needs: [analyze, test]
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🏗️ Build Linux release
        run: |
          cd app
          flutter build linux --release

      - name: 📦 Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: app/build/linux/x64/release/bundle
          retention-days: 7

  build-web:
    name: Build - Web
    runs-on: ubuntu-latest
    needs: [analyze, test]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🌐 Build web release
        run: |
          cd app
          flutter build web --release --web-renderer canvaskit

      - name: 📦 Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web
          retention-days: 7

  build-macos:
    name: Build - macOS
    runs-on: macos-latest
    needs: [analyze, test]
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🍎 Build macOS release
        run: |
          cd app
          flutter build macos --release

      - name: 📦 Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: app/build/macos/Build/Products/Release
          retention-days: 7

  build-windows:
    name: Build - Windows
    runs-on: windows-latest
    needs: [analyze, test]
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: |
          cd app
          flutter pub get

      - name: 🪟 Build Windows release
        run: |
          cd app
          flutter build windows --release

      - name: 📦 Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app/build/windows/x64/runner/Release
          retention-days: 7

  # ============================================================================
  # Summary
  # ============================================================================

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, security, build-linux, build-web, build-macos, build-windows]
    # A cancelled obsolete run has no status left to aggregate.
    if: always() && !cancelled()

    steps:
      - name: 📊 Check results
        run: |
          echo "CI Pipeline Results:"
          echo "===================="
          echo "✅ All checks passed!"
          echo ""
          echo "Next steps:"
          echo "- Review test coverage"
          echo "- Check security audit results"
          echo "- Download build artifacts if needed"
